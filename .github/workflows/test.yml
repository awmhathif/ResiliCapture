name: tests

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Dependency check
        run: python -m pip check
      - name: Compile Python sources
        shell: powershell
        run: python -m compileall -q app.py recorder ui platform_tools tests
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build one-folder application
        run: python -m PyInstaller --noconfirm --clean ResiliCapture.spec
      - name: Verify executable exists
        shell: powershell
        run: if (-not (Test-Path 'dist/ResiliCapture/ResiliCapture.exe')) { throw 'Executable was not built' }
