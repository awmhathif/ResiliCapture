name: release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg for tests only
        shell: powershell
        run: choco install ffmpeg -y --no-progress

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Validate beta release version
        shell: powershell
        run: |
          $version = python -c "from recorder.config import APP_VERSION; print(APP_VERSION)"
          $expected = "v$version-beta"
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match expected beta tag $expected"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$expected" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile and test
        shell: powershell
        run: |
          python -m compileall -q app.py recorder ui platform_tools tests
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

      - name: Build portable Windows app
        env:
          RESILICAPTURE_BUNDLE_FFMPEG: "0"
        run: python -m PyInstaller --noconfirm --clean ResiliCapture.spec

      - name: Package, checksum, and test extracted executable
        run: python scripts/package_windows.py --output .

      - name: Check packaged H.264 finalization with test FFmpeg
        run: python scripts/package_windows.py --check-only --require-ffmpeg

      - uses: actions/attest@v4
        with:
          subject-path: |
            ResiliCapture-${{ env.APP_VERSION }}-Windows.zip
            ResiliCapture-${{ env.APP_VERSION }}-Windows.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResiliCapture-${{ env.APP_VERSION }}-Windows
          path: |
            ResiliCapture-${{ env.APP_VERSION }}-Windows.zip
            ResiliCapture-${{ env.APP_VERSION }}-Windows.zip.sha256
            package-smoke.json

      - name: Publish complete portable beta
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/release-notes-v$env:APP_VERSION-beta.md"
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "ResiliCapture-$env:APP_VERSION-Windows.zip" "ResiliCapture-$env:APP_VERSION-Windows.zip.sha256" --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
            gh release edit "$env:RELEASE_TAG" --title "ResiliCapture $env:APP_VERSION Beta" --notes-file $notes --prerelease
          } else {
            gh release create "$env:RELEASE_TAG" "ResiliCapture-$env:APP_VERSION-Windows.zip" "ResiliCapture-$env:APP_VERSION-Windows.zip.sha256" --title "ResiliCapture $env:APP_VERSION Beta" --notes-file $notes --prerelease --target "${{ github.sha }}"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
